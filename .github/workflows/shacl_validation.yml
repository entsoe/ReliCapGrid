name: SHACL validation (PROF-driven)

on:
  workflow_dispatch:
  push:
    paths:
      - Instance/**
      - buildScripts/validate_instances.py
      - buildScripts/prof_map.py
      - buildScripts/create_test_configuration_release.py
      - buildScripts/test_configurations/**
      - .github/workflows/shacl_validation.yml
      - pyproject.toml

permissions:
  contents: read
  security-events: write

jobs:
  shacl-validation:
    name: Validate all instances via PROF-mapped SHACL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # application-profiles-library only links CGMES/ and NCP/ as submodules
      # since 2026-10-15; check out the two AP repos (PROF + SHACL) directly
      - name: Checkout CGMES application profiles (CGMES 3.0)
        uses: actions/checkout@v4
        with:
          repository: entsoe/CGMES-AP
          path: .apl-cgmes

      - name: Checkout NC application profiles (NCP 2.5)
        uses: actions/checkout@v4
        with:
          repository: entsoe/NC-AP
          path: .apl-ncp

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Download CimPal CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo griddigit/CimPal --pattern 'CimPal-CLI*.jar' --dir tools --clobber

      # the source data is not validated directly (it may hold negative test
      # cases); the generated test configuration release is (issue #332)
      - name: Generate TestConfigurationRelease
        run: |
          uv run buildScripts/create_test_configuration_release.py \
            --cimpal-jar "$(ls tools/CimPal-CLI*.jar | head -n 1)"

      - name: Validate the release, export SARIF + SHACL reports
        run: |
          uv run buildScripts/validate_instances.py --apl cgmes-3.0=.apl-cgmes --apl ncp-2.5=.apl-ncp \
            --release TestConfigurationRelease/FullReliCapGridBaseCase

      - name: Upload TestConfigurationRelease as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestConfigurationRelease
          path: |
            TestConfigurationRelease/
            !TestConfigurationRelease/ReadMe.asc

      # one upload per SARIF run — code scanning does not combine
      # multiple runs uploaded under the same category
      - name: Upload CGMES 3.0 SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/shacl-cgmes-3.0.sarif
          category: shacl-cgmes-3.0

      - name: Upload NCP 2.5 SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/shacl-ncp-2.5.sarif
          category: shacl-ncp-2.5

      - name: Upload CGMES 3.0 schema-conformance SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/schema-cgmes-3.0.sarif
          category: schema-cgmes-3.0

      - name: Upload NCP 2.5 schema-conformance SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/schema-ncp-2.5.sarif
          category: schema-ncp-2.5

      - name: Upload SARIF + full SHACL reports as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: shacl-reports
          path: |
            reports/shacl-*.sarif
            reports/schema-*.sarif
            reports/closure-*.sarif
            reports/*-shacl-report.*
            reports/summary.md

      - name: Run summary with link to code scanning results
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
